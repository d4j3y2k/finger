[package]
name = "finger-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "finger_core"
path = "rust/lib.rs"

[[bin]]
name = "finger-core"
path = "rust/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "debuginfo"

[features]
desktop = []

[[bin]]
name = "Finger"
path = "rust/launcher.rs"
required-features = ["desktop"]
